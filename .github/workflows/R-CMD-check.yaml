on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "4 2 * * 6"
  workflow_dispatch:
  # `labeled`/`unlabeled` so that adding or removing a CI label (`full-ci`,
  # `ci:docs`, `skip-ci:R-CMD-check`) reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

name: R-CMD-check

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# get a group of their own, so every merge is checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    # Decided without a runner: `ci:docs` and `skip-ci:R-CMD-check` skip it;
    # `ci:minimal` still runs it (shared ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:R-CMD-check'))
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # Quick on pull requests. Full on the weekly schedule, on a manual
      # dispatch, and on a pull request labelled `full-ci`.
      profile: auto
      # CRAN's noSuggests flavor: every Suggests package must be optional.
      nosuggests: true
      # CRAN's noLD flavor, checked after acceptance: R-devel without long
      # doubles. Full profile only.
      nold: true
      # Depends: R (>= 4.5.0), for tools::sha256sum() (D13). oldrel-1 is
      # R 4.5.x, which meets it, so the oldest supported R has a leg.
      # Windows R-devel is CRAN's Windows R-devel flavor; nothing else checks
      # it (the containers are Linux). Full profile only.
      runners: >-
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "windows-latest", "r": "devel"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "oldrel-1"}]
      # The `containers` and `quick-containers` defaults are the CRAN-like
      # R-devel images: dazcache has no compiled code, but they are the only
      # R-devel legs, and R-devel is where CRAN checks first.
